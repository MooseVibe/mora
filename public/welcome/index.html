<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/welcome/" />
    <link rel="icon" href="/favicon-light.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const params = new URLSearchParams(window.location.search);
        const isLocal = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname)
          || /^192\.168\./.test(window.location.hostname)
          || /^10\./.test(window.location.hostname)
          || /^172\.(1[6-9]|2\d|3[01])\./.test(window.location.hostname);
        const showPreview = isLocal && params.get("welcomePreview") === "1";
        if (!showPreview && window.localStorage.getItem("mora:prototype:welcomeCompleted") === "1") {
          window.location.replace("/ritual");
        }
      } catch {
        // Without browser storage the welcome screen remains repeatable.
      }
    </script>
    <title>Mora — карта дня и расклады таро</title>
    <meta
      name="description"
      content="Mora — онлайн-ритуал таро: вытягивай карту дня или делай расклад из трёх карт и получай связное толкование."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mora-kappa.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Mora" />
    <meta property="og:title" content="Бесплатные ритуалы таро" />

      property="og:description"

    />
    <meta property="og:url" content="https://mora-kappa.vercel.app/" />
    <meta property="og:image" content="https://mora-kappa.vercel.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mora — твой ежедневный ритуал таро" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mora-kappa.vercel.app/og-cover.png" />

        <p>Вытягивай карту дня, делай расклады и замечай то, что обычно остаётся без внимания</p>
